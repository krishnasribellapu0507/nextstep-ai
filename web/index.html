<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NextStep AI</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Inter,system-ui,Arial,sans-serif;
    background:#080b12;
    color:#eef2ff;
}
.wrap{
    width:min(980px,92%);
    margin:40px auto;
}
.hero{
    margin-bottom:28px;
}
h1{
    font-size:42px;
    margin:0 0 8px;
}
.sub{
    color:#99a5bb;
    font-size:17px;
}
.card{
    background:#111722;
    border:1px solid #253047;
    border-radius:18px;
    padding:22px;
    margin:18px 0;
}
.row{
    display:grid;
    grid-template-columns:1fr 180px;
    gap:12px;
}
input,button{
    width:100%;
    padding:14px 15px;
    border-radius:12px;
    border:1px solid #33415c;
    font-size:16px;
}
input{
    background:#090e17;
    color:white;
}
button{
    cursor:pointer;
    background:#7c5cff;
    color:white;
    border:0;
    font-weight:700;
}
button:hover{
    opacity:.92;
}
.badge{
    display:inline-block;
    padding:7px 10px;
    border-radius:999px;
    background:#202a3e;
    margin-right:8px;
    margin-bottom:8px;
}
.question{
    font-size:22px;
    line-height:1.45;
}
.guidance{
    color:#cbd5e1;
    line-height:1.6;
}
.bar{
    height:9px;
    background:#252d3c;
    border-radius:999px;
    overflow:hidden;
    margin-top:7px;
}
.fill{
    height:100%;
    background:#8d79ff;
}
.concept{
    margin:13px 0;
}
.small{
    color:#8995aa;
    font-size:13px;
}
.good{color:#7ce7a7}
.bad{color:#ff9191}
.hidden{display:none}
@media(max-width:650px){
    .row{grid-template-columns:1fr}
    h1{font-size:34px}
}
</style>
</head>

<body>
<div class="wrap">

<div class="hero">
    <h1>NextStep AI</h1>
    <div class="sub">
        An adaptive study system that decides what you should learn next.
    </div>
</div>

<div class="card">
    <div class="row">
        <input id="topic" value="eigen values" placeholder="Topic">
        <input id="days" type="number" value="5" min="0" placeholder="Exam days">
    </div>
    <br>
    <button onclick="startLearning()">Start learning</button>
</div>

<div id="workspace" class="hidden">

<div class="card">
    <div id="decision"></div>
</div>

<div class="card">
    <div class="small">NEXT QUESTION</div>
    <div id="question" class="question"></div>

    <br>

    <input id="answer" placeholder="Type your answer">

    <br><br>

    <button onclick="submitAnswer()">Check answer</button>

    <div id="feedback"></div>
</div>

<div class="card">
    <div class="small">YOUR KNOWLEDGE MAP</div>
    <div id="map"></div>
</div>

</div>

</div>

<script>
let current = null;

let studentId =
    localStorage.getItem("nextstep_student_id");

if(!studentId){
    studentId =
        "student-" +
        Math.random()
            .toString(36)
            .slice(2);

    localStorage.setItem(
        "nextstep_student_id",
        studentId
    );
}

function esc(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}

function pct(value){
    return Math.round(value * 100) + "%";
}

function render(step){
    current = step;

    document
        .getElementById("workspace")
        .classList.remove("hidden");

    document.getElementById(
        "decision"
    ).innerHTML = `
        <span class="badge">
            ${esc(step.action)}
        </span>

        <span class="badge">
            confidence ${pct(step.confidence)}
        </span>

        <h2>${esc(step.concept.name)}</h2>

        <div class="guidance">
            ${esc(step.guidance)}
        </div>
    `;

    document.getElementById(
        "question"
    ).textContent =
        step.question.prompt;

    document.getElementById(
        "answer"
    ).value = "";

    document.getElementById(
        "feedback"
    ).innerHTML = "";

    document.getElementById(
        "map"
    ).innerHTML =
        step.mastery_map.map(
            item => `
            <div class="concept">
                <div>
                    ${esc(item.concept)}
                    <span class="small">
                        ${pct(item.mastery)}
                    </span>
                </div>

                <div class="bar">
                    <div
                        class="fill"
                        style="width:${Math.round(item.mastery*100)}%">
                    </div>
                </div>
            </div>
            `
        ).join("");
}

async function startLearning(){
    const response = await fetch(
        "/api/start",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                student_id:studentId,
                topic:
                    document.getElementById("topic").value,
                exam_days:
                    Number(
                        document.getElementById("days").value
                    )
            })
        }
    );

    const data = await response.json();

    if(!response.ok){
        alert(data.detail || "Could not start");
        return;
    }

    render(data);
}

async function submitAnswer(){
    if(!current) return;

    const value =
        document.getElementById("answer").value;

    if(!value.trim()) return;

    const response = await fetch(
        "/api/answer",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                student_id:studentId,
                question_id:
                    current.question.id,
                answer:value,
                hint_used:false
            })
        }
    );

    const data = await response.json();

    if(!response.ok){
        alert(data.detail || "Could not evaluate");
        return;
    }

    const feedback =
        document.getElementById("feedback");

    if(data.correct){
        feedback.innerHTML =
            `<p class="good">✓ Correct</p>`;
    }else{
        feedback.innerHTML =
            `<p class="bad">
                ✗ Not quite — detected:
                ${esc(data.detected_issue)}
            </p>`;
    }

    setTimeout(
        () => render(data.next),
        900
    );
}
</script>

</body>
</html>
